<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPYSOLAR 50,000 — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16241C;
    --paper:#FBF9F4;
    --paper-2:#F1EEE4;
    --gold:#E8A93D;
    --energy:#C6631B;
    --green:#1F7A4D;
    --green-deep:#123D28;
    --line:#E2DCCB;
    --muted:#6B7568;
    --white:#FFFFFF;
    --red:#B23A2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Thai','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 4px;}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 20px;}

  /* ===== LOGIN ===== */
  .login-box{
    max-width:340px;margin:60px auto 0;background:var(--white);
    border:1px solid var(--line);border-radius:16px;padding:24px 20px;text-align:center;
  }
  .login-box .lock{font-size:30px;margin-bottom:8px;}
  .login-box input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:14px;margin:14px 0 10px;text-align:center;
  }
  .login-box button{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:var(--green-deep);color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  }
  .login-err{color:var(--red);font-size:12.5px;margin-top:8px;display:none;}

  /* ===== DASHBOARD ===== */
  .hidden{display:none !important;}
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;
  }
  .toolbar input[type=text]{
    flex:1;min-width:180px;padding:10px 14px;border:1.5px solid var(--line);
    border-radius:10px;font-size:13.5px;
  }
  .btn{
    padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--white);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;
  }
  .btn.primary{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
  .btn.energy{background:var(--energy);color:#fff;border-color:var(--energy);}

  .level-tabs{
    display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;
  }
  .level-tab{
    flex-shrink:0;padding:9px 14px;border-radius:20px;border:1.5px solid var(--line);
    background:var(--white);color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;
    white-space:nowrap;
  }
  .level-tab.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}

  #region-filter{
    padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:13px;background:var(--white);color:var(--ink);flex-shrink:0;
  }

  .approve-cell{white-space:nowrap;}
  .approve-btn{
    display:inline-block;
    padding:5px 9px;
    margin:2px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .approve-btn.done{
    background:#F0F8F3;
    border-color:var(--green);
    color:var(--green-deep);
    cursor:default;
  }

  .stat-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .stat-card{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;min-width:120px;
  }
  .stat-card .n{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--energy);}
  .stat-card .l{font-size:11.5px;color:var(--muted);}

  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--white);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px;}
  th{
    text-align:left;background:var(--paper-2);color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .pill{
    display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;
    background:#F0F8F3;color:var(--green-deep);
  }
  .empty-note{padding:30px;text-align:center;color:var(--muted);font-size:13.5px;}
  .status-msg{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .status-msg.err{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <h1>☀️ HAPPYSOLAR 50,000 — Admin</h1>
  <p class="sub">รายชื่อผู้ลงทะเบียนขอตรวจสอบสิทธิ์ (ข้อมูลจาก Netlify Forms)</p>

  <!-- Netlify Forms detector for approval records (must be static markup) -->
  <form name="happysolar50k_approvals" data-netlify="true" hidden>
    <input type="text" name="appId" />
    <input type="text" name="level" />
    <input type="text" name="approvedBy" />
  </form>

  <div class="login-box" id="login-box">
    <div class="lock">🔒</div>
    <div>ใส่รหัสผ่าน Admin</div>
    <input type="password" id="admin-password" placeholder="รหัสผ่าน">
    <button id="btn-login">เข้าสู่ระบบ</button>
    <div class="login-err" id="login-err">รหัสผ่านไม่ถูกต้อง หรือเชื่อมต่อไม่สำเร็จ</div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="stat-row">
      <div class="stat-card"><div class="n" id="stat-total">0</div><div class="l">ผู้ลงทะเบียนทั้งหมด</div></div>
      <div class="stat-card"><div class="n" id="stat-today">0</div><div class="l">วันนี้</div></div>
      <div class="stat-card"><div class="n" id="stat-week">0</div><div class="l">7 วันล่าสุด</div></div>
    </div>

    <div class="level-tabs" id="level-tabs">
      <button class="level-tab active" data-level="country" type="button">🌏 ทั้งประเทศ</button>
      <button class="level-tab" data-level="region" type="button">🗺️ ระดับภาค</button>
      <button class="level-tab" data-level="district" type="button">📍 ระดับเขต/อำเภอ</button>
    </div>

    <div class="toolbar">
      <select id="region-filter">
        <option value="">ทุกภาค</option>
        <option value="ภาคเหนือ">ภาคเหนือ</option>
        <option value="ภาคกลาง">ภาคกลาง</option>
        <option value="ภาคตะวันออกเฉียงเหนือ">ภาคตะวันออกเฉียงเหนือ (อีสาน)</option>
        <option value="ภาคตะวันออก">ภาคตะวันออก</option>
        <option value="ภาคตะวันตก">ภาคตะวันตก</option>
        <option value="ภาคใต้">ภาคใต้</option>
      </select>
      <input type="text" id="search-box" placeholder="ค้นหาชื่อ / เบอร์โทร / จังหวัด...">
      <button class="btn" id="btn-refresh">🔄 รีเฟรช</button>
      <button class="btn energy" id="btn-export">⬇️ Export CSV</button>
    </div>

    <div class="status-msg" id="status-msg"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>วันที่</th>
            <th>เลขคำขอ</th>
            <th>ชื่อ</th>
            <th>เบอร์โทร</th>
            <th>จังหวัด</th>
            <th>ภาค</th>
            <th>ประเภท</th>
            <th>ค่าไฟ</th>
            <th>ความสนใจ</th>
            <th>แผนที่</th>
            <th>อนุมัติ</th>
          </tr>
        </thead>
        <tbody id="leads-tbody"></tbody>
      </table>
      <div class="empty-note hidden" id="empty-note">ยังไม่มีผู้ลงทะเบียน</div>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let PASSWORD = '';
  let allLeads = [];
  let approvals = {}; // appId -> {district:bool, region:bool, country:bool}
  let currentLevelFilter = 'country'; // country = no restriction, region/district = require prior level approved

  const TYPE_LABELS = {home:'บ้านอยู่อาศัย',farmer:'เกษตรกร',shop:'ร้านค้า',biz:'ธุรกิจ',other:'อื่นๆ'};
  const BILL_LABELS = {'1':'< 1,500 บาท','2':'1,500-3,000 บาท','3':'3,000-5,000 บาท','4':'5,000-10,000 บาท','5':'> 10,000 บาท'};

  const PROVINCE_REGION = {
    'เชียงใหม่':'ภาคเหนือ','เชียงราย':'ภาคเหนือ','ลำพูน':'ภาคเหนือ','ลำปาง':'ภาคเหนือ','แพร่':'ภาคเหนือ','น่าน':'ภาคเหนือ',
    'พะเยา':'ภาคเหนือ','แม่ฮ่องสอน':'ภาคเหนือ','อุตรดิตถ์':'ภาคเหนือ','ตาก':'ภาคเหนือ','สุโขทัย':'ภาคเหนือ',
    'พิษณุโลก':'ภาคเหนือ','พิจิตร':'ภาคเหนือ','เพชรบูรณ์':'ภาคเหนือ','กำแพงเพชร':'ภาคเหนือ','นครสวรรค์':'ภาคเหนือ','อุทัยธานี':'ภาคเหนือ',
    'กรุงเทพมหานคร':'ภาคกลาง','นนทบุรี':'ภาคกลาง','ปทุมธานี':'ภาคกลาง','สมุทรปราการ':'ภาคกลาง','นครปฐม':'ภาคกลาง',
    'สมุทรสาคร':'ภาคกลาง','พระนครศรีอยุธยา':'ภาคกลาง','สิงห์บุรี':'ภาคกลาง','ลพบุรี':'ภาคกลาง','ชัยนาท':'ภาคกลาง',
    'สระบุรี':'ภาคกลาง','อ่างทอง':'ภาคกลาง','สุพรรณบุรี':'ภาคกลาง','นครนายก':'ภาคกลาง','สมุทรสงคราม':'ภาคกลาง',
    'นครราชสีมา':'ภาคตะวันออกเฉียงเหนือ','บุรีรัมย์':'ภาคตะวันออกเฉียงเหนือ','สุรินทร์':'ภาคตะวันออกเฉียงเหนือ','ศรีสะเกษ':'ภาคตะวันออกเฉียงเหนือ',
    'อุบลราชธานี':'ภาคตะวันออกเฉียงเหนือ','ยโสธร':'ภาคตะวันออกเฉียงเหนือ','ชัยภูมิ':'ภาคตะวันออกเฉียงเหนือ','อำนาจเจริญ':'ภาคตะวันออกเฉียงเหนือ',
    'หนองบัวลำภู':'ภาคตะวันออกเฉียงเหนือ','ขอนแก่น':'ภาคตะวันออกเฉียงเหนือ','อุดรธานี':'ภาคตะวันออกเฉียงเหนือ','เลย':'ภาคตะวันออกเฉียงเหนือ',
    'หนองคาย':'ภาคตะวันออกเฉียงเหนือ','มหาสารคาม':'ภาคตะวันออกเฉียงเหนือ','ร้อยเอ็ด':'ภาคตะวันออกเฉียงเหนือ','กาฬสินธุ์':'ภาคตะวันออกเฉียงเหนือ',
    'สกลนคร':'ภาคตะวันออกเฉียงเหนือ','นครพนม':'ภาคตะวันออกเฉียงเหนือ','มุกดาหาร':'ภาคตะวันออกเฉียงเหนือ','บึงกาฬ':'ภาคตะวันออกเฉียงเหนือ',
    'ชลบุรี':'ภาคตะวันออก','ระยอง':'ภาคตะวันออก','จันทบุรี':'ภาคตะวันออก','ตราด':'ภาคตะวันออก','ฉะเชิงเทรา':'ภาคตะวันออก',
    'ปราจีนบุรี':'ภาคตะวันออก','สระแก้ว':'ภาคตะวันออก',
    'กาญจนบุรี':'ภาคตะวันตก','ตาก':'ภาคตะวันตก','ราชบุรี':'ภาคตะวันตก','เพชรบุรี':'ภาคตะวันตก','ประจวบคีรีขันธ์':'ภาคตะวันตก','ประจวบคีรีขันธ์':'ภาคตะวันตก',
    'ชุมพร':'ภาคใต้','ระนอง':'ภาคใต้','สุราษฎร์ธานี':'ภาคใต้','พังงา':'ภาคใต้','ภูเก็ต':'ภาคใต้','กระบี่':'ภาคใต้',
    'นครศรีธรรมราช':'ภาคใต้','ตรัง':'ภาคใต้','พัทลุง':'ภาคใต้','สตูล':'ภาคใต้','สงขลา':'ภาคใต้','ปัตตานี':'ภาคใต้','ยะลา':'ภาคใต้','นราธิวาส':'ภาคใต้'
  };
  function provinceToRegion(province){
    if(!province) return '-';
    const trimmed = province.trim();
    if(PROVINCE_REGION[trimmed]) return PROVINCE_REGION[trimmed];
    for(const key in PROVINCE_REGION){
      if(trimmed.includes(key) || key.includes(trimmed)) return PROVINCE_REGION[key];
    }
    return '-';
  }

  async function fetchLeads(){
    $('status-msg').textContent = 'กำลังโหลดข้อมูล...';
    $('status-msg').className = 'status-msg';
    try{
      const res = await fetch('/.netlify/functions/admin-leads', {
        headers: { 'X-Admin-Password': PASSWORD }
      });
      const json = await res.json();
      if(!res.ok || !json.ok){
        throw new Error(json.error || ('HTTP ' + res.status));
      }
      allLeads = json.submissions || [];
      approvals = mergeApprovals(json.approvals || []);
      $('status-msg').textContent = json.note ? json.note : ('โหลดสำเร็จ — ' + allLeads.length + ' รายการ');
      renderStats();
      applyFilters();
      return true;
    }catch(err){
      $('status-msg').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + err.message;
      $('status-msg').className = 'status-msg err';
      return false;
    }
  }

  function mergeApprovals(list){
    const map = {};
    list.forEach(a=>{
      const d = a.data || {};
      if(!d.appId || !d.level) return;
      if(!map[d.appId]) map[d.appId] = {district:false, region:false, country:false};
      if(d.level === 'district' || d.level === 'region' || d.level === 'country') map[d.appId][d.level] = true;
    });
    return map;
  }

  function renderStats(){
    $('stat-total').textContent = allLeads.length;
    const now = new Date();
    const todayStr = now.toDateString();
    const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
    let today = 0, week = 0;
    allLeads.forEach(l=>{
      const d = new Date(l.created_at);
      if(d.toDateString() === todayStr) today++;
      if(d >= weekAgo) week++;
    });
    $('stat-today').textContent = today;
    $('stat-week').textContent = week;
  }

  function approveLead(appId, level){
    const payload = { 'form-name': 'happysolar50k_approvals', appId, level, approvedBy: 'owner' };
    const body = Object.keys(payload).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(payload[k])).join('&');
    fetch('/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body })
      .then(()=>{
        if(!approvals[appId]) approvals[appId] = {district:false, region:false, country:false};
        approvals[appId][level] = true;
        applyFilters();
      })
      .catch(()=>{ alert('บันทึกการอนุมัติไม่สำเร็จ ลองใหม่อีกครั้ง'); });
  }
  window.approveLead = approveLead;

  function renderTable(list){
    const tbody = $('leads-tbody');
    if(!list.length){
      tbody.innerHTML = '';
      $('empty-note').classList.remove('hidden');
      return;
    }
    $('empty-note').classList.add('hidden');
    tbody.innerHTML = list.map(l=>{
      const d = l.data || {};
      const date = l.created_at ? new Date(l.created_at).toLocaleString('th-TH') : '-';
      const typeLabel = TYPE_LABELS[d.usertype] || d.usertype || '-';
      const billLabel = BILL_LABELS[d.bill] || '-';
      const region = provinceToRegion(d.province);
      const appId = d.appId || '';
      const ap = approvals[appId] || {district:false, region:false, country:false};
      const approveBtn = (level, label) => {
        const done = ap[level];
        return `<button type="button" class="approve-btn ${done?'done':''}" ${done?'disabled':''} onclick="approveLead('${appId}','${level}')">${done?'✅':'⬜'} ${label}</button>`;
      };
      return `<tr>
        <td>${escapeHtml(date)}</td>
        <td><span class="pill">${escapeHtml(appId||'-')}</span></td>
        <td>${escapeHtml(d.name||'-')}</td>
        <td>${escapeHtml(d.phone||'-')}</td>
        <td>${escapeHtml(d.province||'-')}</td>
        <td>${escapeHtml(region)}</td>
        <td>${escapeHtml(typeLabel)}</td>
        <td>${escapeHtml(billLabel)}</td>
        <td>${escapeHtml(d.purpose||'-')}</td>
        <td>${(d.lat && d.lng) ? `<a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" rel="noopener">📍 เปิดแผนที่</a>` : '-'}</td>
        <td class="approve-cell">
          ${approveBtn('district','เขต')}
          ${approveBtn('region','ภาค')}
          ${approveBtn('country','ประเทศ')}
        </td>
      </tr>`;
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function applyFilters(){
    const q = $('search-box').value.trim().toLowerCase();
    const regionSel = $('region-filter').value;
    let filtered = allLeads.filter(l=>{
      const d = l.data || {};
      const matchesSearch = !q || [d.name, d.phone, d.province, d.appId].some(v=> (v||'').toLowerCase().includes(q));
      const matchesRegion = !regionSel || provinceToRegion(d.province) === regionSel;
      let matchesLevel = true;
      if(currentLevelFilter === 'region'){
        const ap = approvals[d.appId] || {};
        matchesLevel = !!ap.district; // only show leads that already cleared district level
      } else if(currentLevelFilter === 'district'){
        matchesLevel = true; // district is the entry level — show all
      }
      return matchesSearch && matchesRegion && matchesLevel;
    });
    renderTable(filtered);
  }

  $('level-tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.level-tab');
    if(!btn) return;
    currentLevelFilter = btn.dataset.level;
    [...$('level-tabs').children].forEach(b=>b.classList.toggle('active', b===btn));
    applyFilters();
  });

  $('region-filter').addEventListener('change', applyFilters);

  $('search-box').addEventListener('input', applyFilters);

  $('btn-refresh').addEventListener('click', fetchLeads);

  $('btn-export').addEventListener('click', ()=>{
    const rows = [['วันที่','เลขคำขอ','ชื่อ','เบอร์โทร','LINE ID','Email','จังหวัด','ภาค','อำเภอ','ตำบล','ประเภท','ประเภทบ้าน','ค่าไฟ','ความสนใจ','ช่องทางติดต่อ','ลิงก์แผนที่']];
    allLeads.forEach(l=>{
      const d = l.data || {};
      const mapLink = (d.lat && d.lng) ? ('https://www.google.com/maps?q='+d.lat+','+d.lng) : '';
      rows.push([
        l.created_at ? new Date(l.created_at).toLocaleString('th-TH') : '',
        d.appId||'', d.name||'', d.phone||'', d.lineid||'', d.email||'',
        d.province||'', provinceToRegion(d.province), d.amphoe||'', d.tambon||'',
        TYPE_LABELS[d.usertype]||d.usertype||'', d.housetype||'',
        BILL_LABELS[d.bill]||'', d.purpose||'', d.contactpref||'', mapLink
      ]);
    });
    const csv = rows.map(r=> r.map(cell=>'"'+String(cell).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'happysolar50000-leads.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  $('btn-login').addEventListener('click', async ()=>{
    PASSWORD = $('admin-password').value;
    $('login-err').style.display = 'none';
    const ok = await fetchLeads();
    if(ok){
      $('login-box').classList.add('hidden');
      $('dashboard').classList.remove('hidden');
      sessionStorage.setItem('happysolar50k_admin_pw', PASSWORD);
    } else {
      $('login-err').style.display = 'block';
    }
  });

  $('admin-password').addEventListener('keydown', e=>{
    if(e.key === 'Enter') $('btn-login').click();
  });

  // auto-login if password already present in this tab's session
  const saved = sessionStorage.getItem('happysolar50k_admin_pw');
  if(saved){
    PASSWORD = saved;
    fetchLeads().then(ok=>{
      if(ok){
        $('login-box').classList.add('hidden');
        $('dashboard').classList.remove('hidden');
      }
    });
  }
})();
</script>
</body>
</html>
