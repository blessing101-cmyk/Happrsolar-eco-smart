<!DOCTYPE html>
<html lang="th" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPYSOLAR 50,000 — ลงทะเบียนตรวจสอบสิทธิ์</title>
<meta name="description" content="ลงทะเบียนตรวจสอบสิทธิ์สนับสนุนโซลาร์เซลล์ 50,000 บาทต่อครัวเรือน กับ HAPPYSOLAR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --ink:#16241C;
    --paper:#FBF9F4;
    --paper-2:#F1EEE4;
    --gold:#E8A93D;
    --energy:#C6631B;
    --green:#1F7A4D;
    --green-deep:#123D28;
    --line:#E2DCCB;
    --muted:#6B7568;
    --white:#FFFFFF;
    --red:#B23A2E;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter','Noto Sans Thai','Noto Sans SC',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    padding-bottom:28px;
  }
  h1,h2,h3{font-family:'Space Grotesk','Noto Sans Thai','Noto Sans SC',sans-serif;margin:0;}
  p{margin:0;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  /* ===== TOPBAR ===== */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(251,249,244,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-logo{height:44px;width:auto;display:block;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:-0.01em;}
  .lang-switch{display:flex;gap:4px;background:var(--paper-2);border-radius:20px;padding:3px;}
  .lang-switch button{
    border:none;background:transparent;color:var(--muted);
    font-size:11px;font-weight:600;padding:6px 10px;border-radius:16px;cursor:pointer;
  }
  .lang-switch button.active{background:var(--green-deep);color:#fff;}

  /* ===== SCREEN LAYOUT ===== */
  .screen{padding:0 18px;}

  /* ===== HERO ===== */
  .hero{
    padding:28px 4px 20px;
    text-align:center;
  }
  .hero-badge{
    display:inline-block;
    background:var(--green-deep);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    margin-bottom:16px;
  }
  .hero-title{
    font-size:24px;
    line-height:1.25;
    font-weight:700;
    margin-bottom:18px;
  }
  .hero-amount{
    background:linear-gradient(155deg,#FFF6E4,#FCEBC8);
    border:1px solid #EFD69B;
    border-radius:var(--radius-lg);
    padding:22px 10px 20px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .hero-amount::before{
    content:"☀";
    position:absolute;
    top:-18px; right:-6px;
    font-size:90px;
    color:rgba(232,169,61,.18);
  }
  .amount-num{
    display:block;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:56px;
    line-height:1;
    color:var(--energy);
    letter-spacing:-0.02em;
  }
  .amount-unit{
    display:block;
    margin-top:6px;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .hero-desc{
    font-size:14px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:20px;
    padding:0 4px;
  }
  .hero-note{
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
  }

  .btn-primary{
    display:block;
    width:100%;
    background:var(--energy);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 14px 28px -14px rgba(198,99,27,.55);
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{
    display:block;
    width:100%;
    background:transparent;
    color:var(--green-deep);
    border:1.5px solid var(--green-deep);
    border-radius:14px;
    padding:14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
  }
  .btn-block{margin-top:10px;}
  .btn-text{
    background:none;border:none;color:var(--green-deep);
    font-weight:600;font-size:14px;cursor:pointer;padding:8px 0;
  }

  /* ===== DISCLAIMER ===== */
  .disclaimer{
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    background:var(--paper-2);
    border-left:3px solid var(--gold);
    border-radius:8px;
    padding:12px 14px;
    margin:6px 0 26px;
  }

  /* ===== SECTIONS ===== */
  .section-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:14px;
  }
  section{margin-bottom:30px;}

  .journey-steps{
    display:flex;
    flex-direction:column;
    gap:0;
    border-left:2px dashed var(--line);
    margin-left:20px;
  }
  .jstep{
    position:relative;
    padding:0 0 24px 26px;
  }
  .jstep:last-child{padding-bottom:0;}
  .jstep::before{
    content:attr(data-num);
    position:absolute;
    left:-21px; top:-2px;
    width:38px;height:38px;
    background:var(--green-deep);
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .jstep-title{font-weight:700;font-size:14.5px;margin-bottom:2px;}
  .jstep-icon{font-size:19px;margin-right:6px;}

  .who-list{
    list-style:none;
    margin:0;padding:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .who-list li{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 10px;
    text-align:center;
    font-size:13px;
    font-weight:600;
  }
  .who-list .wico{display:block;font-size:24px;margin-bottom:6px;}

  .why-grid{display:flex;flex-direction:column;gap:10px;}
  .why-item{
    display:flex;align-items:flex-start;gap:10px;
    font-size:13.5px;line-height:1.5;
  }
  .why-item .check{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;
    background:var(--green);color:#fff;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }

  details.faq-item{
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  details.faq-item summary{
    font-weight:600;font-size:14px;cursor:pointer;list-style:none;
    display:flex;justify-content:space-between;align-items:center;
  }
  details.faq-item summary::-webkit-details-marker{display:none;}
  details.faq-item summary::after{content:"+";font-size:20px;color:var(--muted);}
  details.faq-item[open] summary::after{content:"–";}
  .faq-a{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6;}

  .sticky-cta{margin-top:6px;margin-bottom:10px;}

  /* ===== WIZARD ===== */
  .wizard-head{
    display:flex;align-items:center;gap:12px;
    padding:16px 0 18px;
  }
  .btn-back{
    background:var(--paper-2);border:none;border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0;
  }
  .progress{flex:1;height:6px;background:var(--paper-2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;width:20%;background:var(--green);transition:width .3s;}
  .step-label{font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;font-family:'Space Grotesk',sans-serif;}

  .step-title{font-size:19px;font-weight:700;margin-bottom:4px;}
  .step-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number]{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:14.5px;background:var(--white);color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--green);}

  .opt-group{display:flex;flex-direction:column;gap:8px;}
  .opt-group.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .opt-card{
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:13px 14px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    background:var(--white);
    display:flex;align-items:center;gap:10px;
    user-select:none;
  }
  .opt-card .dot{
    width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    position:relative;
  }
  .opt-card.checkbox .dot{border-radius:5px;}
  .opt-card.selected{border-color:var(--green);background:#F0F8F3;}
  .opt-card.selected .dot{border-color:var(--green);}
  .opt-card.selected .dot::after{
    content:"";position:absolute;inset:3px;border-radius:50%;background:var(--green);
  }
  .opt-card.checkbox.selected .dot::after{border-radius:2px;}

  .unsure-note{
    font-size:12.5px;color:var(--green-deep);background:#F0F8F3;
    border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.5;
  }

  .map-box{
    border:1.5px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    background:var(--white);
  }
  .map-locate-btn{
    display:block;
    width:100%;
    padding:11px;
    background:var(--green-deep);
    color:#fff;
    border:none;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  #location-map{
    width:100%;
    height:220px;
    background:var(--paper-2);
  }
  .map-hint{
    font-size:11.5px;
    color:var(--muted);
    padding:8px 12px 0;
  }
  .map-coords{
    font-size:12px;
    font-weight:600;
    color:var(--green-deep);
    padding:6px 12px 12px;
    font-family:'Space Grotesk',monospace;
  }

  .summary-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px;margin-bottom:16px;
  }
  .summary-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--line);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--muted);}
  .summary-row .v{font-weight:600;text-align:right;}

  .consent-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;font-size:12.5px;line-height:1.55;color:var(--ink);}
  .consent-row input{margin-top:3px;flex-shrink:0;width:16px;height:16px;}

  .wizard-foot{padding:14px 0 22px;}
  .field-error{font-size:12px;color:var(--red);margin-top:6px;display:none;}

  /* ===== SUCCESS ===== */
  .success-hero{text-align:center;padding:30px 4px 20px;}
  .success-icon{font-size:52px;margin-bottom:10px;}
  .app-id-card{
    background:var(--green-deep);color:#fff;border-radius:var(--radius-lg);
    padding:18px;text-align:center;margin:18px 0 24px;
  }
  .app-id-label{font-size:11px;opacity:.75;margin-bottom:4px;}
  .app-id-value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:.03em;}

  /* ===== TIMELINE ===== */
  .timeline{border-left:2px solid var(--line);margin-left:11px;padding-left:22px;}
  .tl-item{position:relative;padding-bottom:22px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:"";position:absolute;left:-28px;top:2px;
    width:14px;height:14px;border-radius:50%;
    background:var(--line);border:3px solid var(--paper);
    box-shadow:0 0 0 2px var(--line);
  }
  .tl-item.done::before{background:var(--green);box-shadow:0 0 0 2px var(--green);}
  .tl-item.current::before{background:var(--gold);box-shadow:0 0 0 2px var(--gold);}
  .tl-title{font-size:14px;font-weight:600;}
  .tl-item.done .tl-title{color:var(--green-deep);}
  .tl-item.current .tl-title{color:#8A5A00;}
  .tl-item:not(.done):not(.current) .tl-title{color:var(--muted);}

  .demo-box{
    margin-top:26px;border:1px dashed var(--line);border-radius:12px;padding:14px;
    font-size:12px;color:var(--muted);
  }
  .demo-box b{color:var(--ink);}
  .demo-box select{margin-top:8px;width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);}

  /* ===== DASHBOARD ===== */
  .dash-greet{padding:22px 2px 6px;}
  .dash-greet h2{font-size:19px;}
  .dash-status-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:#FFF6E4;color:#8A5A00;border:1px solid #EFD69B;
    padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;margin-top:8px;
  }
  .dash-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;
  }
  .dash-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 14px;
  }
  .dash-card .dico{font-size:22px;margin-bottom:8px;display:block;}
  .dash-card .dtitle{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .dash-card .dval{font-size:16px;font-weight:700;}

  .phase2-note{
    margin-top:26px;font-size:12px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:16px;line-height:1.6;
  }
  .staff-link{
    display:block;
    text-align:center;
    margin-top:14px;
    font-size:11.5px;
    color:var(--muted);
    text-decoration:underline;
  }
</style>
</head>

  let LANG = localStorage.getItem('happysolar50k_lang') || 'th';

  function t(key){
    return (I18N[LANG] && I18N[LANG][key]) || (I18N.th[key]) || key;
  }

  function applyLang(){
    document.getElementById('htmlRoot').lang = LANG === 'zh' ? 'zh-Hans' : LANG;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('#lang-switch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang === LANG);
    });
    document.title = LANG==='th' ? "HAPPYSOLAR 50,000 — ลงทะเบียนตรวจสอบสิทธิ์" :
                      LANG==='zh' ? "HAPPYSOLAR 50,000 — 登记核实补贴资格" :
                      "HAPPYSOLAR 50,000 — Register your eligibility";
    if(currentScreen === 'wizard') renderWizardStep();
    if(currentScreen === 'status') renderStatusScreen();
    if(currentScreen === 'dashboard') renderDashboard();
  }

  $('lang-switch').addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    LANG = btn.dataset.lang;
    localStorage.setItem('happysolar50k_lang', LANG);
    applyLang();
  });

  // ============ SCREEN NAV ============
  let currentScreen = 'home';
  const screens = ['home','wizard','success','status','dashboard'];
  function showScreen(name){
    currentScreen = name;
    screens.forEach(s=>{
      $('screen-'+s).classList.toggle('hidden', s!==name);
    });
    window.scrollTo({top:0, behavior:'instant'});
    if(name === 'wizard') renderWizardStep();
    if(name === 'status') renderStatusScreen();
    if(name === 'dashboard') renderDashboard();
  }

  $('btn-start-register').addEventListener('click', ()=>{ resetWizard(); showScreen('wizard'); });
  $('btn-check-eligibility').addEventListener('click', ()=>{ resetWizard(); showScreen('wizard'); });
  $('btn-cta-bottom').addEventListener('click', ()=>{ resetWizard(); showScreen('wizard'); });
  $('wizard-back').addEventListener('click', ()=>{
    if(wizardStep === 0){ showScreen('home'); }
    else { wizardStep--; renderWizardStep(); }
  });
  $('status-back').addEventListener('click', ()=>{ showScreen(lastAppSubmitted ? 'success' : 'home'); });
  $('dash-back').addEventListener('click', ()=>{ showScreen('success'); });
  $('btn-goto-status').addEventListener('click', ()=> showScreen('status'));
  $('btn-goto-dashboard').addEventListener('click', ()=> showScreen('dashboard'));
  $('dash-view-status').addEventListener('click', ()=> showScreen('status'));

  // ============ WIZARD STATE ============
  let wizardStep = 0;
  let formData = {};
  let lastAppSubmitted = false;

  function resetWizard(){
    wizardStep = 0;
    formData = {};
  }

  function setField(key, val){ formData[key] = val; }

  function optCardHTML(groupKey, value, label, multi){
    const selected = multi ? (Array.isArray(formData[groupKey]) && formData[groupKey].includes(value))
                           : formData[groupKey] === value;
    return `<div class="opt-card ${multi?'checkbox':''} ${selected?'selected':''}" data-group="${groupKey}" data-value="${value}" data-multi="${multi?1:0}">
      <span class="dot"></span><span>${label}</span>
    </div>`;
  }

  function bindOptCards(container){
    container.querySelectorAll('.opt-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        const group = card.dataset.group;
        const value = card.dataset.value;
        const multi = card.dataset.multi === '1';
        if(multi){
          if(!Array.isArray(formData[group])) formData[group] = [];
          const idx = formData[group].indexOf(value);
          if(idx>-1) formData[group].splice(idx,1); else formData[group].push(value);
        } else {
          formData[group] = value;
        }
        renderWizardStep();
      });
    });
  }

  const TOTAL_STEPS = 5;

  function renderWizardStep(){
    $('wizard-progress').style.width = (((wizardStep+1)/TOTAL_STEPS)*100)+'%';
    $('wizard-steplabel').textContent = String(wizardStep+1).padStart(2,'0')+' / 0'+TOTAL_STEPS;
    const body = $('wizard-body');
    let html = '';

    if(wizardStep === 0){
      html += `<div class="step-sub">${t('step1_sub')}</div><div class="step-title">${t('step1_title')}</div>`;
      html += `<div class="field"><label>${t('q_usertype')}</label><div class="opt-group">`;
      html += optCardHTML('usertype','home',t('opt_home'),false);
      html += optCardHTML('usertype','farmer',t('opt_farmer'),false);
      html += optCardHTML('usertype','shop',t('opt_shop'),false);
      html += optCardHTML('usertype','biz',t('opt_biz'),false);
      html += optCardHTML('usertype','other',t('opt_other'),false);
      html += `</div></div>`;
      html += `<div class="field"><label>${t('q_baac')}</label><div class="opt-group">`;
      html += optCardHTML('baac','yes',t('opt_yes'),false);
      html += optCardHTML('baac','no',t('opt_no'),false);
      html += optCardHTML('baac','unsure',t('opt_unsure'),false);
      html += `</div>`;
      if(formData.baac === 'unsure'){ html += `<div class="unsure-note">${t('unsure_note')}</div>`; }
      html += `</div>`;
    }

    else if(wizardStep === 1){
      html += `<div class="step-sub">${t('step2_sub')}</div><div class="step-title">${t('step2_title')}</div>`;
      html += `<div class="field">
        <label>${t('f_map_label')}</label>
        <div class="map-box">
          <button type="button" class="map-locate-btn" id="map-locate-btn">📍 ${t('btn_use_gps')}</button>
          <div id="location-map"></div>
          <div class="map-hint">${t('map_hint')}</div>
          <div class="map-coords" id="map-coords">${formData.lat ? t('map_pin_set')+': '+Number(formData.lat).toFixed(5)+', '+Number(formData.lng).toFixed(5) : t('map_no_pin')}</div>
        </div>
      </div>`;
      html += `<div class="field"><label>${t('f_province')}</label><input type="text" id="f-province" value="${formData.province||''}"></div>`;
      html += `<div class="field"><label>${t('f_amphoe')}</label><input type="text" id="f-amphoe" value="${formData.amphoe||''}"></div>`;
      html += `<div class="field"><label>${t('f_tambon')}</label><input type="text" id="f-tambon" value="${formData.tambon||''}"></div>`;
      html += `<div class="field"><label>${t('q_housetype')}</label><div class="opt-group">`;
      html += optCardHTML('housetype','single',t('opt_single'),false);
      html += optCardHTML('housetype','garden',t('opt_garden'),false);
      html += optCardHTML('housetype','farmhouse',t('opt_farmhouse'),false);
      html += optCardHTML('housetype','other',t('opt_other'),false);
      html += `</div></div>`;
      html += `<div class="field"><label>${t('q_installarea')}</label><div class="opt-group grid2">`;
      html += optCardHTML('installarea','roof',t('opt_roof'),false);
      html += optCardHTML('installarea','ground',t('opt_ground'),false);
      html += optCardHTML('installarea','unsure',t('opt_unsure'),false);
      html += `</div></div>`;
      html += `<div class="field"><label>${t('q_watt')}</label><input type="number" id="f-watt" min="0" step="100" placeholder="${t('ph_watt')}" value="${formData.watt||''}"></div>`;
      html += `<div class="field"><label>${t('q_meter')}</label><div class="opt-group grid2">`;
      html += optCardHTML('meter','have',t('opt_have'),false);
      html += optCardHTML('meter','none',t('opt_none'),false);
      html += optCardHTML('meter','unsure',t('opt_unsure'),false);
      html += `</div></div>`;
    }

    else if(wizardStep === 2){
      html += `<div class="step-sub">${t('step3_sub')}</div><div class="step-title">${t('step3_title')}</div>`;
      html += `<div class="field"><label>${t('q_bill')}</label><div class="opt-group">`;
      html += optCardHTML('bill','1',t('opt_bill1'),false);
      html += optCardHTML('bill','2',t('opt_bill2'),false);
      html += optCardHTML('bill','3',t('opt_bill3'),false);
      html += optCardHTML('bill','4',t('opt_bill4'),false);
      html += optCardHTML('bill','5',t('opt_bill5'),false);
      html += `</div></div>`;
      html += `<div class="field"><label>${t('q_purpose')}</label><div class="opt-group">`;
      html += optCardHTML('purpose','reduce',t('opt_p1'),true);
      html += optCardHTML('purpose','income',t('opt_p2'),true);
      html += optCardHTML('purpose','backup',t('opt_p3'),true);
      html += optCardHTML('purpose','clean',t('opt_p4'),true);
      html += optCardHTML('purpose','longterm',t('opt_p5'),true);
      html += `</div></div>`;
      html += `<div class="field"><label>${t('q_paymenttype')}</label><div class="opt-group">`;
      html += optCardHTML('paymenttype','cash',t('opt_cash'),false);
      html += optCardHTML('paymenttype','installment',t('opt_installment'),false);
      html += optCardHTML('paymenttype','unsure',t('opt_pt_unsure'),false);
      html += `</div></div>`;
    }

    else if(wizardStep === 3){
      html += `<div class="step-sub">${t('step4_sub')}</div><div class="step-title">${t('step4_title')}</div>`;
      html += `<div class="field"><label>${t('f_name')}</label><input type="text" id="f-name" value="${formData.name||''}"></div>`;
      html += `<div class="field"><label>${t('f_phone')}</label><input type="tel" id="f-phone" value="${formData.phone||''}"></div>`;
      html += `<div class="field"><label>${t('f_line')}</label><input type="text" id="f-line" value="${formData.lineid||''}"></div>`;
      html += `<div class="field"><label>${t('f_email')}</label><input type="email" id="f-email" value="${formData.email||''}"></div>`;
      html += `<div class="field"><label>${t('q_contactpref')}</label><div class="opt-group grid2">`;
      html += optCardHTML('contactpref','phone',t('opt_c_phone'),false);
      html += optCardHTML('contactpref','line',t('opt_c_line'),false);
      html += optCardHTML('contactpref','email',t('opt_c_email'),false);
      html += `</div></div>`;
    }

    else if(wizardStep === 4){
      html += `<div class="step-sub">${t('step5_sub')}</div><div class="step-title">${t('step5_title')}</div>`;
      const usertypeLabel = formData.usertype ? t('opt_'+({home:'home',farmer:'farmer',shop:'shop',biz:'biz',other:'other'}[formData.usertype])) : '—';
      const houseLabel = formData.housetype ? t('opt_'+({single:'single',garden:'garden',farmhouse:'farmhouse',other:'other'}[formData.housetype])) : '—';
      const billMap = {1:'opt_bill1',2:'opt_bill2',3:'opt_bill3',4:'opt_bill4',5:'opt_bill5'};
      const billLabel = formData.bill ? t(billMap[formData.bill]) : '—';
      const purposeMap = {reduce:'opt_p1',income:'opt_p2',backup:'opt_p3',clean:'opt_p4',longterm:'opt_p5'};
      const purposeLabel = (formData.purpose||[]).map(p=>t(purposeMap[p])).join(', ') || '—';

      html += `<div class="summary-card">
        <div class="summary-row"><span class="k">${t('sum_name')}</span><span class="v">${formData.name||'—'}</span></div>
        <div class="summary-row"><span class="k">${t('sum_province')}</span><span class="v">${formData.province||'—'}</span></div>
        <div class="summary-row"><span class="k">${t('sum_housetype')}</span><span class="v">${houseLabel}</span></div>
        <div class="summary-row"><span class="k">${t('sum_bill')}</span><span class="v">${billLabel}</span></div>
        <div class="summary-row"><span class="k">${t('sum_purpose')}</span><span class="v">${purposeLabel}</span></div>
      </div>`;
      html += `<label class="consent-row"><input type="checkbox" id="consent1" ${formData.consent1?'checked':''}><span>${t('consent1')}</span></label>`;
      html += `<label class="consent-row"><input type="checkbox" id="consent2" ${formData.consent2?'checked':''}><span>${t('consent2')}</span></label>`;
      html += `<label class="consent-row"><input type="checkbox" id="consent3" ${formData.consent3?'checked':''}><span>${t('consent3')}</span></label>`;
    }

    html += `<div class="field-error" id="wizard-error">${t('err_required')}</div>`;
    body.innerHTML = html;
    bindOptCards(body);

    ['f-province','f-amphoe','f-tambon','f-name','f-phone','f-line','f-email','f-watt'].forEach(id=>{
      const el = document.getElementById(id);
      if(el){
        el.addEventListener('input', ()=>{
          const map = {'f-province':'province','f-amphoe':'amphoe','f-tambon':'tambon','f-name':'name','f-phone':'phone','f-line':'lineid','f-email':'email','f-watt':'watt'};
          formData[map[id]] = el.value;
        });
      }
    });
    ['consent1','consent2','consent3'].forEach(id=>{
      const el = document.getElementById(id);
      if(el){ el.addEventListener('change', ()=>{ formData[id] = el.checked; }); }
    });

    if(wizardStep === 1){ initLocationMap(); }

    $('wizard-next').textContent = (wizardStep === TOTAL_STEPS-1) ? t('wizard_submit') : t('wizard_next');
  }

  // ============ LOCATION MAP (free, no API key — Leaflet + OpenStreetMap) ============
  let leafletMap = null;
  let leafletMarker = null;
  const DEFAULT_LATLNG = [13.7563, 100.5018]; // Bangkok, used only as a fallback starting view

  function setPinCoords(lat, lng){
    formData.lat = lat;
    formData.lng = lng;
    const coordsEl = document.getElementById('map-coords');
    if(coordsEl) coordsEl.textContent = t('map_pin_set') + ': ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
    reverseGeocodeAndFill(lat, lng);
  }

  async function reverseGeocodeAndFill(lat, lng){
    const coordsEl = document.getElementById('map-coords');
    try{
      if(coordsEl) coordsEl.textContent += ' — ' + t('geo_filling');
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=th&zoom=14`, {
        headers: { 'Accept': 'application/json' }
      });
      const data = await res.json();
      const addr = data.address || {};
      let province, amphoe, tambon;
      if(addr.state){
        province = addr.state;
        amphoe = addr.county || addr.town || addr.district || '';
        tambon = addr.suburb || addr.village || addr.subdistrict || addr.neighbourhood || '';
      } else {
        province = addr.city || addr.province || '';
        amphoe = addr.suburb || addr.city_district || addr.county || '';
        tambon = addr.neighbourhood || addr.quarter || addr.village || '';
        }

      if(province){ formData.province = province; const el = document.getElementById('f-province'); if(el) el.value = province; }
      if(amphoe){ formData.amphoe = amphoe; const el = document.getElementById('f-amphoe'); if(el) el.value = amphoe; }
      if(tambon){ formData.tambon = tambon; const el = document.getElementById('f-tambon'); if(el) el.value = tambon; }

      if(coordsEl) coordsEl.textContent = t('map_pin_set') + ': ' + lat.toFixed(5) + ', ' + lng.toFixed(5) + (province ? ' — ' + [tambon,amphoe,province].filter(Boolean).join(', ') : '');
    }catch(err){
      if(coordsEl) coordsEl.textContent = t('map_pin_set') + ': ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
    }
  }

  function initLocationMap(){
    const mapEl = document.getElementById('location-map');
    if(!mapEl || typeof L === 'undefined') return;

    const startLatLng = (formData.lat && formData.lng) ? [formData.lat, formData.lng] : DEFAULT_LATLNG;
    const startZoom = (formData.lat && formData.lng) ? 16 : 6;

    leafletMap = L.map(mapEl, { attributionControl:true }).setView(startLatLng, startZoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(leafletMap);

    if(formData.lat && formData.lng){
      leafletMarker = L.marker(startLatLng, { draggable:true }).addTo(leafletMap);
      leafletMarker.on('dragend', ()=>{
        const pos = leafletMarker.getLatLng();
        setPinCoords(pos.lat, pos.lng);
      });
    }

    leafletMap.on('click', (e)=>{
      const { lat, lng } = e.latlng;
      if(leafletMarker){
        leafletMarker.setLatLng([lat, lng]);
      } else {
        leafletMarker = L.marker([lat, lng], { draggable:true }).addTo(leafletMap);
        leafletMarker.on('dragend', ()=>{
          const pos = leafletMarker.getLatLng();
          setPinCoords(pos.lat, pos.lng);
        });
      }
      setPinCoords(lat, lng);
    });

    const locateBtn = document.getElementById('map-locate-btn');
    if(locateBtn){
      locateBtn.addEventListener('click', ()=>{
        if(!navigator.geolocation){
          alert(t('geo_unsupported'));
          return;
        }
        locateBtn.textContent = '📍 ' + t('geo_locating');
        navigator.geolocation.getCurrentPosition(
          (pos)=>{
            const { latitude, longitude } = pos.coords;
            leafletMap.setView([latitude, longitude], 17);
            if(leafletMarker){
              leafletMarker.setLatLng([latitude, longitude]);
            } else {
              leafletMarker = L.marker([latitude, longitude], { draggable:true }).addTo(leafletMap);
              leafletMarker.on('dragend', ()=>{
                const p = leafletMarker.getLatLng();
                setPinCoords(p.lat, p.lng);
              });
            }
            setPinCoords(latitude, longitude);
            locateBtn.textContent = '📍 ' + t('btn_use_gps');
          },
          ()=>{
            alert(t('geo_denied'));
            locateBtn.textContent = '📍 ' + t('btn_use_gps');
          },
          { enableHighAccuracy:true, timeout:10000 }
        );
      });
    }

    setTimeout(()=>{ if(leafletMap) leafletMap.invalidateSize(); }, 200);
  }

  function validateStep(){
    if(wizardStep === 0) return !!formData.usertype && !!formData.baac;
    if(wizardStep === 1) return !!(formData.province && formData.housetype && formData.installarea && formData.meter && formData.watt);
    if(wizardStep === 2) return !!formData.bill && !!formData.paymenttype;
    if(wizardStep === 3) return !!(formData.name && formData.phone && formData.contactpref);
    if(wizardStep === 4) return !!(formData.consent1 && formData.consent2 && formData.consent3);
    return true;
  }

  $('wizard-next').addEventListener('click', ()=>{
    if(!validateStep()){
      $('wizard-error').style.display = 'block';
      return;
    }
    $('wizard-error').style.display = 'none';
    if(wizardStep < TOTAL_STEPS-1){
      wizardStep++;
      renderWizardStep();
    } else {
      submitApplication();
    }
  });

  // ============ SUBMIT / STORAGE ============
  const urlRef = new URLSearchParams(location.search).get('ref');
  if(urlRef){ sessionStorage.setItem('happysolar50k_ref', urlRef); }
  const REF_CODE = urlRef || sessionStorage.getItem('happysolar50k_ref') || '01';

  function genAppId(){
    const d = new Date();
    const yy = String(d.getFullYear()).slice(2);
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
    return `HS-${yy}${mm}${dd}-${rand}`;
  }

  const FORM_SHARED_SECRET = "kOhyfJBuKP1sdSwdm5dZzYj6PdZkqxcT";

  function encodeFormData(obj){
    return Object.keys(obj).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(obj[k]==null?'':obj[k])).join('&');
  }

  async function sendToNetlifyForms(appId){
    const payload = {
      'form-name': 'happysolar50k',
      appId,
      ref: REF_CODE,
      name: formData.name || '',
      phone: formData.phone || '',
      lineid: formData.lineid || '',
      email: formData.email || '',
      province: formData.province || '',
      amphoe: formData.amphoe || '',
      tambon: formData.tambon || '',
      usertype: formData.usertype || '',
      housetype: formData.housetype || '',
      installarea: formData.installarea || '',
      meter: formData.meter || '',
      watt: formData.watt || '',
      bill: formData.bill || '',
      purpose: (formData.purpose||[]).join(', '),
      paymenttype: formData.paymenttype || '',
      contactpref: formData.contactpref || '',
      baac: formData.baac || '',
      lat: formData.lat || '',
      lng: formData.lng || '',
      mapLink: (formData.lat && formData.lng) ? ('https://www.google.com/maps?q=' + formData.lat + ',' + formData.lng) : ''
    };
    try{
      await fetch('/', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: encodeFormData(payload)
      });
    }catch(err){ /* non-critical: local record + LINE push still happened */ }
  }

  async function sendLineNotification(appId){
    const billMap = {1:'< 1,500 บาท',2:'1,500-3,000 บาท',3:'3,000-5,000 บาท',4:'5,000-10,000 บาท',5:'> 10,000 บาท'};
    const typeMap = {home:'บ้านอยู่อาศัย',farmer:'เกษตรกร',shop:'ร้านค้า',biz:'ธุรกิจ',other:'อื่นๆ'};
    const lines = [
      '🔔 มีผู้ลงทะเบียน HAPPYSOLAR 50,000 ใหม่',
      'เลขคำขอ: ' + appId,
      'ชื่อ: ' + (formData.name || '-'),
      'เบอร์โทร: ' + (formData.phone || '-'),
      'ประเภท: ' + (typeMap[formData.usertype] || formData.usertype || '-'),
      'จังหวัด: ' + (formData.province || '-'),
      'ค่าไฟ: ' + (billMap[formData.bill] || '-'),
      'ชำระเงิน: ' + ({cash:'ซื้อสด',installment:'ผ่อนชำระ',unsure:'ยังไม่แน่ใจ'}[formData.paymenttype] || '-')
    ];
    if(formData.watt){
      lines.push('ขนาดที่ต้องการ: ' + formData.watt + ' วัตต์');
    }
    if(formData.lat && formData.lng){
      lines.push('พิกัดบ้าน: https://www.google.com/maps?q=' + formData.lat + ',' + formData.lng);
    }
    if(REF_CODE){
      lines.push('👤 ผู้แนะนำ (Sale): ' + REF_CODE);
    }
    try{
      await fetch('/.netlify/functions/notify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Form-Secret': FORM_SHARED_SECRET},
        body: JSON.stringify({
          name: formData.name || '-',
          phone: formData.phone || '-',
          type: typeMap[formData.usertype] || formData.usertype || '-',
          province: formData.province || '-',
          monthlyKwh: '',
          recKw: '',
          estSavings: lines.join(' | ')
        })
      });
    }catch(err){ /* non-critical: local record + form log still happened */ }
  }

  function submitApplication(){
    const appId = genAppId();
    const record = {
      appId,
      data: formData,
      stage: 1,
      createdAt: new Date().toISOString()
    };
    let list = [];
    try{ list = JSON.parse(localStorage.getItem('happysolar50k_apps')||'[]'); }catch(e){ list = []; }
    list.push(record);
    try{ localStorage.setItem('happysolar50k_apps', JSON.stringify(list)); }catch(e){}
    localStorage.setItem('happysolar50k_last_app', appId);
    lastAppSubmitted = true;

    sendToNetlifyForms(appId);
    sendLineNotification(appId);

    $('success-app-id').textContent = appId;
    const linePrefill = (formData.phone || '').trim();
    $('btn-line-connect').href = 'https://line.me/R/oaMessage/@224jrjso/?' + encodeURIComponent(linePrefill);
    showScreen('success');
  }

  function getLastApp(){
    const id = localStorage.getItem('happysolar50k_last_app');
    if(!id) return null;
    let list = [];
    try{ list = JSON.parse(localStorage.getItem('happysolar50k_apps')||'[]'); }catch(e){ list = []; }
    return list.find(a=>a.appId === id) || null;
  }

  function saveApp(app){
    let list = [];
    try{ list = JSON.parse(localStorage.getItem('happysolar50k_apps')||'[]'); }catch(e){ list = []; }
    const idx = list.findIndex(a=>a.appId === app.appId);
    if(idx>-1) list[idx] = app; else list.push(app);
    try{ localStorage.setItem('happysolar50k_apps', JSON.stringify(list)); }catch(e){}
  }

  // ============ STATUS SCREEN ============
  const STAGE_KEYS = ['tl_received','tl_screening','tl_contact','tl_survey','tl_docs','tl_proceed'];

  function renderStatusScreen(){
    const app = getLastApp();
    if(!app){
      $('status-app-id').textContent = '—';
      $('status-timeline').innerHTML = `<p style="font-size:13px;color:var(--muted);">${t('no_app_found')}</p>`;
      $('demo-stage-select').innerHTML = '';
      return;
    }
    $('status-app-id').textContent = app.appId;
    let html = '';
    STAGE_KEYS.forEach((key, i)=>{
      let cls = '';
      if(i < app.stage) cls = 'done';
      else if(i === app.stage) cls = 'current';
      html += `<div class="tl-item ${cls}"><div class="tl-title">${t(key)}</div></div>`;
    });
    $('status-timeline').innerHTML = html;

    const sel = $('demo-stage-select');
    sel.innerHTML = STAGE_KEYS.map((key,i)=>`<option value="${i}" ${i===app.stage?'selected':''}>${i+1}. ${t(key)}</option>`).join('');
    sel.onchange = ()=>{
      app.stage = Number(sel.value);
      saveApp(app);
      renderStatusScreen();
    };
  }

  // ============ DASHBOARD ============
  function renderDashboard(){
    const app = getLastApp();
    const name = app && app.data && app.data.name ? app.data.name : '';
    $('dash-greet-name').textContent = t('hello_prefix') + (name || '—');
    $('dash-status-text').textContent = t('dash_status_screening');
  }

  // ============ INIT ============
  applyLang();
  showScreen('home');
})();
</script>
